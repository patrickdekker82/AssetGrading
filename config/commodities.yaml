# Currency pairs: long the first currency, short the second. Every pair is also followed the other way
# round (USD/EUR next to EUR/USD); the two are each other's mirror image.
fx_pairs: [EUR/USD, EUR/GBP, EUR/JPY, EUR/CHF, EUR/SEK, EUR/NOK, EUR/AUD, EUR/CAD, EUR/CNY,
           GBP/USD, USD/JPY, USD/CHF, AUD/USD, USD/CAD, USD/CNY]
# Per currency: short-term interest rate (FRED series, in order of preference; the first one with a value in
# the last 120 days is used), real effective exchange rate (BIS via FRED), World Bank country code, CFTC
# code of the futures contract against the dollar (Traders in Financial Futures report).
currencies:
  EUR: {rates: [ECBESTRVOLWGTTRMDMNRT, IR3TIB01EZM156N], reer: RBXMBIS, worldbank: EMU, cftc: "099741"}
  USD: {rates: [SOFR, IR3TIB01USM156N], reer: RBUSBIS, worldbank: USA}
