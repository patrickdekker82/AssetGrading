# Commodities (chapter 2: "circa 20") and currency pairs (chapter 2: "circa 15").
#
# Commodities: prices of the front futures contract (Yahoo `=F`) for the chart, the futures curve from the
# next listed contracts (Yahoo `<root><month><yy>.<exchange>`), speculator positions from the CFTC
# (disaggregated report, managed money) and, for energy, inventories from the EIA (needs EIA_API_KEY).
# The trend is measured on the product (ETC) where one is followed: an ETC is a roll-adjusted series, the
# front contract is not. `months`: futures month codes that are listed (F=Jan ... Z=Dec).
commodities:
  - {slug: gold, name: Goud, template: precious_metal, class: Edelmetalen, front: "GC=F", root: GC, exchange: CMX, months: GJMQVZ, cftc: "088691"}
  - {slug: silver, name: Zilver, template: precious_metal, class: Edelmetalen, front: "SI=F", root: SI, exchange: CMX, months: HKNUZ, cftc: "084691"}
  - {slug: platinum, name: Platina, template: precious_metal, class: Edelmetalen, front: "PL=F", root: PL, exchange: NYM, months: FJNV, cftc: "076651"}
  - {slug: palladium, name: Palladium, template: precious_metal, class: Edelmetalen, front: "PA=F", root: PA, exchange: NYM, months: HMUZ, cftc: "075651"}
