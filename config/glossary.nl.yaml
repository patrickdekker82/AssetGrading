# Woordenlijst - de enige bron voor tooltips in de interface.
# `terms`: algemene begrippen. `metrics`: elke maatstaf uit config/model/metrics.yaml.
# Houd uitleg kort en in gewone taal; geen beleggingsadvies.

terms:
  grade:
    label: Grade
    uitleg: Een letter van A+ tot F die aangeeft waar een asset staat in de ranglijst van zijn eigen klasse. Een rangorde, geen voorspelling.
  score:
    label: Score
    uitleg: Een getal van 0 tot 100 waaruit de grade volgt. Hoger betekent beter binnen de vergelijkingsgroep.
  kwaliteit:
    label: Kwaliteit
    uitleg: Deelscore uit alle pijlers behalve trend en momentum. Zegt iets over de asset zelf, los van het moment.
  timing:
    label: Timing
    uitleg: Deelscore uit de technische analyse (trend, momentum, volatiliteit). Zegt iets over het moment, niet over de asset.
  datadekking:
    label: Datadekking
    uitleg: Welk deel van het model met echte data gevuld kon worden. Onder 60% is de grade voorlopig, onder 40% tonen we geen grade.
  voorlopig:
    label: Voorlopig
    uitleg: De datadekking ligt onder 60%. De grade is minder betrouwbaar en wordt grijs getoond.
  pijler:
    label: Pijler
    uitleg: Een groep maatstaven die samen één kant van een asset meten, zoals waardering of veiligheid. Elke pijler heeft een gewicht.
  gewicht:
    label: Gewicht
    uitleg: Hoe zwaar een pijler meetelt in de eindscore. De gewichten per sjabloon tellen op tot 100.
  maatstaf:
    label: Maatstaf
    uitleg: Eén meetbaar getal, zoals vrije-kasstroomrendement of volatiliteit.
  percentiel:
    label: Percentiel
    uitleg: Positie ten opzichte van vergelijkbare assets op een schaal van 0 tot 100. Percentiel 80 betekent beter dan 80% van de groep.
  vergelijkingsgroep:
    label: Vergelijkingsgroep
    uitleg: De assets waarmee vergeleken wordt, zoals dezelfde sector bij aandelen of dezelfde index bij ETF's.
  gate:
    label: Gate
    uitleg: Een harde regel die de grade begrenst, bijvoorbeeld hoogstens C bij verhoogd faillissementsrisico. Een gate wint altijd van de gewogen score.
  hysterese:
    label: Hysterese
    uitleg: De letter verandert pas als de score een grens met minstens 2 punten passeert of er 5 handelsdagen overheen blijft. Dat voorkomt heen-en-weer springen.
  bandbreedte:
    label: Bandbreedte
    uitleg: Het bereik van de grade als elk gewicht 20% hoger of lager zou zijn. Een smalle band betekent een stevige grade.
  marktregime:
    label: Marktregime
    uitleg: "Een stand per week (risico aan, neutraal, risico uit) uit drie invoeren: de wereldindex tegenover zijn 10-maandsgemiddelde, de renteopslag op high-yield-obligaties en de VIX, elk tegenover de eigen historie. Bij risico uit gaat de grade van aandelen en crypto één stapje omlaag; gates blijven gelden."
  modelversie:
    label: Modelversie
    uitleg: Het versienummer van de gebruikte instellingen (pijlers, gewichten, gates). Elke wijziging geeft een nieuwe versie.
  peildatum:
    label: Peildatum
    uitleg: De datum van de data waarop de grade berekend is.
  horizon:
    label: Horizon
    uitleg: De periode waarvoor de grade bedoeld is, meestal 6 tot 12 maanden.
  sjabloon:
    label: Sjabloon
    uitleg: Het beoordelingsmodel voor een soort asset. Een bank wordt anders beoordeeld dan een REIT of Bitcoin; er zijn 16 sjablonen.
  technische_score:
    label: Technische score
    uitleg: Score uit trendstand, momentum, afstand tot de 52-weekse top, relatieve sterkte en volatiliteit.
  terugtest:
    label: Terugtest
    uitleg: Het model toegepast op het verleden met alleen data die toen beschikbaar was. Geen behaald resultaat.
  rangcorrelatie:
    label: Rangcorrelatie
    uitleg: Hoe goed de volgorde van de scores past bij de volgorde van latere rendementen. 0 is geen verband, 1 is perfect; 0,02 tot 0,06 is al goed.
  benchmark:
    label: Benchmark
    uitleg: De maatstaf waartegen een asset wordt afgezet, bijvoorbeeld een wereldindex of Bitcoin.
  eur_koers:
    label: Koers in euro
    uitleg: Omgerekend met de referentiekoersen van de ECB. De oorspronkelijke valuta staat erbij.
  regime_risico_aan:
    label: Risico aan
    uitleg: De markt is in een gunstige stand; trend en kredietopslagen zijn rustig.
  regime_risico_uit:
    label: Risico uit
    uitleg: De markt is gespannen; trend, kredietopslagen of VIX wijzen op stress.
  speculatie:
    label: Speculatie
    uitleg: Label voor memecoins. Er is geen onderbouwde waardering mogelijk; alleen een veiligheidscontrole.
  pegveiligheid:
    label: Pegveiligheid
    uitleg: Bij stablecoins een cijfer van 1 (sterk) tot 5 (zwak) voor de kans dat de koppeling aan 1,00 houdt.
  etc:
    label: ETC
    uitleg: Exchange traded commodity, een beursgenoteerd product waarmee je een grondstof kunt volgen.
  ucits:
    label: UCITS
    uitleg: Europese regels voor beleggingsfondsen. UCITS-ETF's zijn verkrijgbaar voor Nederlandse particulieren.
  kid:
    label: KID
    uitleg: Essentiële-informatiedocument. Zonder Europees KID mag een fonds niet aan Nederlandse particulieren worden aangeboden.
  mica:
    label: MiCA
    uitleg: Europese wet voor cryptoaanbieders. Een aanbieder met MiCA-vergunning staat onder toezicht.
  fdv:
    label: FDV
    uitleg: Fully diluted value, de waarde als alle tokens die ooit kunnen bestaan al in omloop zouden zijn.
  contango:
    label: Contango
    uitleg: Latere termijncontracten zijn duurder dan nabije. Wie doorrolt, verliest daarop.
  backwardation:
    label: Backwardation
    uitleg: Latere termijncontracten zijn goedkoper dan nabije. Wie doorrolt, verdient daarop.
  carry:
    label: Carry
    uitleg: De opbrengst als de prijs gelijk blijft, zoals renteverschil bij valuta of rolopbrengst bij grondstoffen.
  rangnummer:
    label: Rang
    uitleg: Positie in de ranglijst van deze tab, op volgorde van score.
  sector:
    label: Sector
    uitleg: De bedrijfstak van een aandeel, afgeleid uit de SIC-code in de SEC-registratie (of handmatig bij AEX-fondsen zonder SEC-registratie). Aandelen worden binnen hun sector vergeleken; een sector met minder dan acht aandelen valt terug op alle aandelen met hetzelfde sjabloon.
  ttm:
    label: Laatste twaalf maanden
    uitleg: Omzet, winst en kasstroom over de laatste vier kwartalen, berekend uit het laatste jaarverslag en de kwartaalcijfers sindsdien.
  beurswaarde:
    label: Beurswaarde
    uitleg: Het aantal aandelen (verwaterd, uit de laatste SEC-cijfers) maal de slotkoers zoals die op de beurs gold.
  rest_na_kosten:
    label: Rest na kosten
    uitleg: Tracking difference plus de lopende kosten. Wat overblijft komt van belasting op dividend, opbrengst uit het uitlenen van effecten en de manier van repliceren. Positief betekent dat het fonds meer terugverdient dan de kosten.
  gecorrigeerde_koers:
    label: Gecorrigeerde koers
    uitleg: Koersen in de grafiek en voor momentum zijn gecorrigeerd voor dividend en splitsingen, zodat een uitkering niet als koersdaling telt.
  overrendement:
    label: Overrendement
    uitleg: Het rendement van een asset min dat van de benchmark van zijn klasse over dezelfde periode. Positief betekent dat de asset de benchmark versloeg.
  t_waarde:
    label: t-waarde
    uitleg: Hoe ver een gemiddelde van nul ligt, gemeten in onzekerheid. Boven 2 is het waarschijnlijk geen toeval; het model eist voor wijzigingen minstens 3. Gerekend met Newey-West, omdat overlappende periodes elkaar beïnvloeden.
  ijking:
    label: IJking
    uitleg: Het verschuiven van de lettergrenzen per sjabloon, zodat in de terugtest ongeveer 10% een A krijgt, 20% een B, 40% een C, 20% een D en 10% een F. Gebeurt alleen na akkoord van de eigenaar.
  grote_misser:
    label: Grote misser
    uitleg: Een asset met een A of B die daarna meer dan 30% achterbleef bij de benchmark.
  wisselingen:
    label: Wisselingen
    uitleg: Hoe vaak de letter van een asset van de ene maand op de volgende verandert. Veel wisselingen maken een grade minder bruikbaar.

