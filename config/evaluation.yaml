# Outcomes, monthly measurement, backtest and calibration (chapter 8).
# Not part of the model version: nothing here changes a grade. A calibration only becomes part of the model
# after the owner approves the proposal and a new model version is locked.

horizons_months: [1, 3, 6, 12]

# Benchmark per template: an asset slug, `class_average` (equal-weighted average return of the assets of the
# same template and class at that month-end) or null (no benchmark: the excess return is the return itself,
# as for currency pairs whose score is a direction score).
benchmarks:
  crypto_bitcoin: bitcoin
  crypto_platform: bitcoin
  crypto_defi: bitcoin
  crypto_utility: bitcoin
  crypto_rwa: bitcoin
  crypto_memecoin: bitcoin
  crypto_stablecoin: null
  stock_general: {by_country: {NL: aex}, default: sp500}
  stock_financial: {by_country: {NL: aex}, default: sp500}
  stock_reit: {by_country: {NL: aex}, default: sp500}
  etf: msci-world
  index: msci-world
  bond: class_average
  commodity: class_average
  precious_metal: class_average
  fx_pair: null

min_assets_per_month: 5          # fewer assets in a month: no rank correlation for that month
big_miss: {letters: [A+, A, A-, B+, B, B-], excess_below: -0.30}

live:
  min_months: 12                 # below this the Model page says "onvoldoende data"

backtest:
  start: "2010-01"               # first month-end; templates without data that early simply start later
  classes: [crypto, stocks, markets, commodities]

calibration:
  # Share of grades per letter after calibration (chapter 5): best 10% A, next 20% B, middle 40% C, ...
  target: {A: 0.10, B: 0.20, C: 0.40, D: 0.20, F: 0.10}
  min_months: 24                 # fewer backtest months for a template: keep the provisional bounds
  min_observations: 300          # graded asset-months
  round_to: 0.5
