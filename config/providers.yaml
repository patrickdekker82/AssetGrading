# Data providers (chapter 4). Not part of the model version: changing a limit does not change grades.
# rate_limit: at most `calls` per `per_seconds`. monthly_budget: hard stop (cost units per calendar
# month, UTC); null = no budget. raw_retention_days: how long raw responses are kept (call log stays).
# Limits checked against provider documentation on 2026-10-11; see CHANGELOG for deviations.

providers:
  binance:
    base_url: https://data-api.binance.vision
    rate_limit: {calls: 5, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 400
  coinbase:
    base_url: https://api.exchange.coinbase.com
    rate_limit: {calls: 3, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 400
  coingecko:
    base_url: https://api.coingecko.com/api/v3
    api_key_env: COINGECKO_API_KEY
    # Demo plan: 10,000 calls a month. Stop at 9,000 to keep room for manual searches.
    rate_limit: {calls: 25, per_seconds: 60}
    monthly_budget: 9000
    raw_retention_days: 400
    attribution: Data van CoinGecko
  defillama:
    base_url: https://api.llama.fi
    rate_limit: {calls: 1, per_seconds: 1}
    monthly_budget: null
    # The daily overview responses are several MB; keep raw copies for a month.
    raw_retention_days: 30
  coinmetrics:
    base_url: https://community-api.coinmetrics.io/v4
    # Community API: 10 requests per 6 seconds; non-commercial licence.
    rate_limit: {calls: 8, per_seconds: 6}
    monthly_budget: null
    raw_retention_days: 400
  coinbase_book:
    base_url: https://api.exchange.coinbase.com
    rate_limit: {calls: 3, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 14       # level-2 books are large
  binance_futures:
    base_url: https://fapi.binance.com
    rate_limit: {calls: 5, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 90
  bybit:
    base_url: https://api.bybit.com
    rate_limit: {calls: 5, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 90
  okx:
    base_url: https://www.okx.com
    rate_limit: {calls: 5, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 90
  bitvavo:
    base_url: https://api.bitvavo.com
    rate_limit: {calls: 5, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 90
  dexscreener:
    base_url: https://api.dexscreener.com
    rate_limit: {calls: 5, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 90
  rugcheck:
    base_url: https://api.rugcheck.xyz
    rate_limit: {calls: 1, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 14       # full reports are several MB
  defillama_stablecoins:
    base_url: https://stablecoins.llama.fi
    rate_limit: {calls: 1, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 30
  frankfurter:
    base_url: https://api.frankfurter.dev/v1
    rate_limit: {calls: 1, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 400
  fred:
    base_url: https://api.stlouisfed.org/fred
    api_key_env: FRED_API_KEY
    rate_limit: {calls: 60, per_seconds: 60}
    monthly_budget: null
    raw_retention_days: 400
    attribution: "Bron: FRED, Federal Reserve Bank of St. Louis"

  sec:
    base_url: https://data.sec.gov
    # SEC allows 10 requests per second and requires a User-Agent with a contact (SEC_USER_AGENT in .env).
    rate_limit: {calls: 5, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 45       # company facts are several MB per company; re-read monthly anyway
  sec_insider:
    base_url: https://www.sec.gov
    # Form 4 insider filings: quarterly data sets (zip, 5-20 MB, history) and single filings (recent).
    # Shares SEC's limit of 10 requests a second with `sec` (5 + 4).
    rate_limit: {calls: 4, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 30
    raw_max_bytes: 1000000       # the zips are not kept; their rows are
  tiingo:
    base_url: https://api.tiingo.com
    api_key_env: TIINGO_API_KEY
    # Free plan: 1,000 requests a day, 50 an hour, 500 distinct tickers a month.
    rate_limit: {calls: 45, per_seconds: 3600}
    monthly_budget: 20000
    raw_retention_days: 400
  eodhd:
    base_url: https://eodhd.com/api
    api_key_env: EODHD_API_KEY
    # Paid (optional). Used only when the key is set.
    rate_limit: {calls: 10, per_seconds: 1}
    monthly_budget: 90000
    raw_retention_days: 400
  yahoo:
    base_url: https://query1.finance.yahoo.com
    # Unofficial and sometimes blocked: kept slow on purpose.
    rate_limit: {calls: 1, per_seconds: 2}
    monthly_budget: null
    raw_retention_days: 90
  ecb:
    base_url: https://data-api.ecb.europa.eu
    rate_limit: {calls: 2, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 90
  treasury:
    base_url: https://home.treasury.gov
    # US Treasury par yield curve: one CSV per year, public domain. Kept slow; a run needs one or two calls.
    rate_limit: {calls: 1, per_seconds: 2}
    monthly_budget: null
    raw_retention_days: 30
  shiller:
    base_url: https://shillerdata.com
    # Robert Shiller's monthly S&P 500 data (CAPE). Read at most weekly; the spreadsheet is about 1.5 MB.
    rate_limit: {calls: 1, per_seconds: 5}
    monthly_budget: null
    raw_retention_days: 60
  marketaux:
    base_url: https://api.marketaux.com
    api_key_env: MARKETAUX_API_KEY
    # Free plan: 100 requests a day, three articles each. Only for the quarterly analysis of misses.
    rate_limit: {calls: 1, per_seconds: 1}
    monthly_budget: 2500
    raw_retention_days: 400
  yahoo_fund:
    base_url: https://query2.finance.yahoo.com
    rate_limit: {calls: 1, per_seconds: 2}
    monthly_budget: null
    raw_retention_days: 90
  cftc:
    base_url: https://publicreporting.cftc.gov
    rate_limit: {calls: 2, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 90
  eia:
    base_url: https://api.eia.gov
    api_key_env: EIA_API_KEY
    rate_limit: {calls: 2, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 90
  worldbank:
    base_url: https://api.worldbank.org
    rate_limit: {calls: 2, per_seconds: 1}
    monthly_budget: null
    raw_retention_days: 400
  openfigi:
    base_url: https://api.openfigi.com
    rate_limit: {calls: 20, per_seconds: 60}
    monthly_budget: null
    raw_retention_days: 400

crypto:
  history_start: "2017-01-01"        # enough for the 200-week average and 3-year volatility history
  markets_page_size: 250             # one CoinGecko call covers the top 250 for membership history
  # CoinGecko categories that keep a coin out of the default list; shown in their own filters.
  excluded_categories:
    stablecoins: stablecoin
    wrapped-tokens: wrapped
    bridged-tokens: wrapped
    liquid-staking-tokens: staked
    liquid-restaking-tokens: staked
  track_stablecoins: 10              # prices for the largest stablecoins (peg safety, USDT conversion)
  # Preference order per asset, with fallback. Coinbase first: real USD quotes, converted with ECB rates.
  # Binance quotes in USDT, converted via Coinbase's USDT-USD close (available from 2021-05-04).
  # CoinGecko last: EUR closes only, one year of history on the Demo plan.
  price_sources: [coinbase, binance, coingecko]
  binance_quotes: [USDT]
  coinbase_quotes: [USD, EUR]
  # A venue symbol is only accepted when its last close is within this ratio of CoinGecko's price,
  # so a ticker shared by two different coins never feeds the wrong price series.
  mapping_price_tolerance: 0.20
  metadata_refresh_days: 30
  coinmetrics_metrics: [CapMVRVCur, CapMrktCurUSD, AdrActCnt, TxCnt, FeeTotNtv, IssTotUSD, IssTotNtv, SplyCur, HashRate]
  # Funding and open interest: first reachable venue wins per coin (Binance and Bybit refuse some regions).
  derivatives_sources: [binance_futures, bybit, okx]
  derivatives_backfill_days: 365
  # Exchanges with a MiCA licence, used for the gate "niet verhandelbaar bij een aanbieder met
  # MiCA-vergunning". Licences as understood on 2026-10-11; check the ESMA/AFM registers when in doubt.
  mica_venues: [coinbase, bitvavo]

fx:
  base: EUR
  currencies: [USD, GBP, CHF, JPY, CAD, AUD, NOK, SEK, DKK, CNY, HKD, SGD, PLN, INR]
  history_start: "2010-01-01"

# Insider transactions (SEC Form 4): quarterly data sets from history_start, then single filings.
insider:
  history_start: "2009-07-01"
  new_company_years: 4
  max_filings_per_run: 3000

# News (Marketaux, free key: 100 requests a day) for the analysis of large misses only.
news:
  per_miss: 10
  max_calls_per_run: 40

macro:
  history_start: "1990-01-01"
  fred_series:
    BAMLH0A0HYM2: Renteopslag high-yield-obligaties (VS)
    DFII10: Reële rente 10 jaar (VS)
    DGS10: Rente staatsobligaties 10 jaar (VS)
    DGS2: Rente staatsobligaties 2 jaar (VS)
    DGS3MO: Rente staatsobligaties 3 maanden (VS)
    T10Y2Y: Rentecurve 10 jaar min 2 jaar (VS)
    T10Y3M: Rentecurve 10 jaar min 3 maanden (VS)
    VIXCLS: VIX-volatiliteitsindex
    VXVCLS: VIX over 3 maanden
    DTWEXBGS: Dollarindex (breed, handelsgewogen)
    T10YIE: Verwachte inflatie 10 jaar (VS)
    T5YIE: Verwachte inflatie 5 jaar (VS)
  # ECB yield curve for AAA-rated euro area government bonds (spot rates).
  ecb_series:
    EA_AAA_3M: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_3M", label: "Rente staatsobligaties 3 maanden (eurozone, AAA)"}
    EA_AAA_1Y: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_1Y", label: "Rente staatsobligaties 1 jaar (eurozone, AAA)"}
    EA_AAA_2Y: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y", label: "Rente staatsobligaties 2 jaar (eurozone, AAA)"}
    EA_AAA_5Y: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_5Y", label: "Rente staatsobligaties 5 jaar (eurozone, AAA)"}
    EA_AAA_10Y: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y", label: "Rente staatsobligaties 10 jaar (eurozone, AAA)"}
    EA_AAA_20Y: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_20Y", label: "Rente staatsobligaties 20 jaar (eurozone, AAA)"}
    EA_AAA_30Y: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_30Y", label: "Rente staatsobligaties 30 jaar (eurozone, AAA)"}

schedule:                            # UTC
  crypto: "5 0 * * *"                # 00:05, after the daily close
  # Use day names: APScheduler numbers weekdays from Monday = 0, unlike standard cron.
  fx_macro: "30 16 * * mon-fri"      # after the ECB reference rates (around 16:00 CET)
  prune_raw: "30 3 * * *"
  markets: "45 21 * * mon-fri"       # indices, ETFs and the regime, before the stock run uses the regime
  commodities: "0 22 * * mon-fri"    # US futures settle by 19:30 UTC; ECB rates are out since 16:00 CET
  stocks: "30 22 * * mon-fri"        # well after the US close (16:00 New York = 20:00 or 21:00 UTC)
  # Submit explanation batches after the evening runs and collect them (and crypto's) in the morning.
  explanations: "30 4,23 * * *"
  evaluation: "0 6 2 * *"           # monthly measurement, once the month's last prices are in
  quarterly: "0 7 3 1,4,7,10 *"      # quarterly round: proposals only, nothing changes without the owner
  challenger_backtests: "0 1 * * sun"  # weekly; does nothing when every model version has a backtest
  backup: "0 2 * * *"                # pg_dump to ./backups, after the crypto run
  restore_test: "0 5 * * sun"        # restore the latest dump into an empty database and recompute every grade
  watchdog: "17 * * * *"             # hourly: report a nightly job that did not run
