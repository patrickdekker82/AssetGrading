# Graadmeter - global model settings.
# Every change anywhere under config/model/ requires a new `version`
# and a refreshed entry in versions.lock.yaml (see README, "Modelversie").
version: "0.6.0"
description: Na de controle - winsorizen zonder dubbeltelling, FX "geen voordeel" is precies C, CET1-drempel in ratio, indices in euro, 10-maandsgemiddelde over afgesloten maanden, Timing voor obligatie-ETF's.

default_horizon_months: [6, 12]

# Provisional lower bounds per letter (chapter 5). Calibrated per template in phase 8.
letter_scale:
  A: 75
  B: 62
  C: 45
  D: 32
  F: 0
# Plus and minus split each letter band into thirds. F has no plus/minus.
plus_minus: thirds

scoring:
  winsorize: [0.05, 0.95]        # clip outliers at the 5th and 95th percentile before ranking
  winsor_excludes_self: true     # bounds from the peer group only, so the asset itself is not counted twice
  valuation_mix:                 # applied to pillars marked `valuation: true`
    peer: 0.80
    own_history: 0.20

coverage:
  provisional_below: 0.60        # grey grade with label "voorlopig"
  hidden_below: 0.40             # no grade shown
  # Coverage counts per metric: a pillar with half its metrics filled counts for half its weight.
  # Metrics that do not apply to an asset (applies_to) are left out of the count.

peers:
  min_group_size: 8              # smaller comparison groups fall back to a broader group
  broaden:
    crypto_platform: crypto_alt
    crypto_defi: crypto_alt
    crypto_utility: crypto_alt
    crypto_rwa: crypto_alt
  groups:
    crypto_alt: [crypto_platform, crypto_defi, crypto_utility]
  own_history_years: 3           # window for the 20% own-history part of valuation metrics
  # Stocks compare within their sector; a sector with fewer members than min_group_size falls back to all
  # stocks graded with the same template.

stability:
  hysteresis_points: 2           # letter changes when the bound is crossed by >= 2 points
  hysteresis_days: 5             # ... or stays across the bound for 5 trading days
  band_weight_shift: 0.20        # bandwidth: every weight +/- 20%

# Market regime (chapter 5). Decided once a week, on the completed week (Friday), and stored for every day.
# Each input votes +1 (calm), 0 or -1 (stress); the sum decides the state.
regime:
  states: [risk_on, neutral, risk_off]
  world_index: {index: msci-world, ma_months: 10}        # above its 10-month average: +1, below: -1
  high_yield_spread: {series: BAMLH0A0HYM2, min_history_years: 1, calm_below_pct: 50, stress_above_pct: 80}
  vix: {series: VIXCLS, lookback_years: 10, calm_below_pct: 50, stress_above_pct: 80}
  risk_on_at: 2                  # sum of votes >= 2: risk on
  risk_off_at: -2                # sum of votes <= -2: risk off
  min_inputs: 2                  # fewer inputs available: no regime that day
  scores: {risk_on: 100, neutral: 50, risk_off: 0}       # the metric regime_score (index and Bitcoin macro)
  # Letter shift in notches (B -> B-) for templates with regime_adjust. Only a risk-off regime moves grades,
  # one notch down; gates are applied after the shift and are never set aside.
  grade_shift: {risk_on: 0, neutral: 0, risk_off: -1}
  max_grade_shift_steps: 1

# ETF product scores (chapter 6, ETF). Higher is better; percentiles are taken within the same index.
etf:
  tracking_years: [5, 3]         # tracking difference over 5 years, else 3; fewer years: ongoing charges
  # An index fund that differs more than this per year from its index (or the median fund) points to a wrong
  # price series or an index change: its tracking difference is not used and ongoing charges stand in.
  max_plausible_tracking_difference: 0.015
  replication_scores: {full: 1.0, sampling: 0.9, synthetic: 0.8}
  lending_scores: {"no": 1.0, "yes": 0.9}
  min_peers: 2                   # an index with two ETFs can still be compared

# Bond ETFs (chapter 6, Obligatie). Expected annual loss from default per rating, in percent: long-run
# average default rates (Moody's, 1920 onwards) times 60% loss given default. An own approximation, not a
# published table; unrated holdings count as BBB.
bond:
  expected_loss_pct: {aaa: 0.0, aa: 0.02, a: 0.05, bbb: 0.15, bb: 0.6, b: 2.0, ccc_lower: 8.0, nr: 0.15}
  rating_points: {aaa: 100, aa: 85, a: 70, bbb: 55, bb: 35, b: 20, ccc_lower: 5, nr: 55}
  stale_days: 200                # portfolio figures (yield, duration, ratings) older than this are not used

etf_tax:
  # Withholding tax on US dividends by fund domicile. NL treatment not verified (chapter 6).
  withholding_us_dividends:
    IE: 0.15
    LU: 0.30
    NL: null
  distribution_preference: accumulating   # instelbaar: accumulating | distributing | none

forbidden_words_nl: [kopen, verkopen, koersdoel]
