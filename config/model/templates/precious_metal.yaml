id: precious_metal
name_nl: Edelmetaal
tab: commodities
grading: weighted
assign_on: product_type
peer_group: commodity_class
regime_adjust: false
note_nl: >-
  Het verband tussen goud en de reële rente is sinds 2022 verzwakt door aankopen van centrale banken.
  De goud-zilververhouding is alleen context.
flag_macro_price_divergence: true
pillars:
  - id: trend
    name_nl: Trend
    weight: 30
    timing: true
    metrics: [technical_score]
  - id: macro
    name_nl: Macro
    weight: 25
    metrics:
      - real_rate_10y
      - dollar_index
  - id: demand
    name_nl: Vraag
    weight: 25
    metrics:
      - central_bank_purchases
      - etf_flows
  - id: positioning
    name_nl: Positionering
    weight: 10
    metrics: [cftc_speculator_change]
  - id: carry
    name_nl: Carry
    weight: 10
    metrics: [curve_slope_annualized]
gates: []
product:
  name_nl: Productoordeel (ETC)
  note_nl: Gelijke weging van de maatstaven is een eigen voorstel.
  metrics:
    - replication_physical
    - collateral_score
    - ongoing_charges
    - roll_yield_12m
    - tracking_difference
    - bid_ask_spread
  gates:
    - id: roll_loss
      kind: metric_threshold
      metric: roll_yield_12m
      op: "<"
      value: -0.10
      cap: C
      reason_nl: Het rolverlies is slechter dan 10% per jaar.
    - id: leveraged_or_inverse
      kind: flag
      flag: leveraged_or_inverse
      cap: D
      reason_nl: Hefboom- of inverse product.
    - id: uncollateralized
      kind: flag
      flag: uncollateralized_note
      cap: B-
      reason_nl: Schuldpapier zonder onderpand.
