# Stock universes (chapter 2). Not part of the model version.
#
# United States: the largest US companies that file a 10-K with the SEC, ranked by market cap
# (shares outstanding from SEC filings x latest price). Candidates come from SEC's company list, which is
# ordered by size; foreign companies filing a 20-F are left out of this list.
us:
  candidates: 100                # how many of SEC's largest listings to consider (about 60 file a 10-K)
  forms: ["10-K"]
  benchmark: {slug: sp500, name: S&P 500, yahoo: "^GSPC"}
  # A company with several share classes is followed once, under the ticker SEC lists first (GOOGL, BRK-B).
  # Berkshire Hathaway reports its share count in Class A equivalents; one A share equals 1,500 B shares.
  share_multiplier: {BRK-B: 1500}

