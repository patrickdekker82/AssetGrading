# Build the Graadmeter images for the Synology (linux/amd64) and store them in the private GitHub registry
# (ghcr.io). The NAS fetches them with scripts/nas-update.sh, so nothing has to be built on the NAS or a Mac.
name: images

on:
  push:
    branches: [main, claude/laughing-pasteur-kbmar1]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: server
            context: server
            file: server/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
          - name: bundle
            context: .
            file: Dockerfile.bundle
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/graadmeter-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/graadmeter-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
