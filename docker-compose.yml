# Graadmeter: web interface, calculation server and database.
#   docker compose up --build        (Mac, development)
#   see docker-compose.nas.yml       (Synology, prebuilt images)
name: graadmeter

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graadmeter}
      POSTGRES_USER: ${POSTGRES_USER:-graadmeter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    # Tuned for the DS920+ (4 cores, shared RAM): small buffers, few workers.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=30
      - -c
      - max_worker_processes=3
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - timezone=UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    image: graadmeter-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-graadmeter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-graadmeter}
      CONFIG_DIR: /config
      TZ: UTC
    volumes:
      - ./config:/config:ro
    expose:
      - "8000"

  web:
    build: ./web
    image: graadmeter-web:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL: http://server:8000
      TZ: UTC
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
